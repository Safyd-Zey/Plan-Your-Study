[pytest]
# Pytest configuration for Plan Your Study project
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --strict-markers
    --tb=short

# Allure markers
markers =
    auth: Authentication tests
    courses: Course management tests
    assignments: Assignment management tests
    subtasks: Subtask management tests
    progress: Progress tracking tests
    schedule: Schedule management tests
    integration: Integration tests
    unit: Unit tests
    e2e: End-to-end tests
    critical: Critical functionality
    high_risk: High-risk modules
    slow: Slow tests
